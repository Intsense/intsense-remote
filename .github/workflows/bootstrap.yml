name: Bootstrap source

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: bootstrap
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Assemble IntSense Remote source
        run: |
          if [ -f Cargo.toml ]; then echo "исходники уже собраны"; exit 0; fi
          bash branding/bootstrap.sh
          git config user.name "IntSense"
          git config user.email "noreply@intsense.ai"
          git add -A
          git commit -qm "IntSense Remote source"
          git push
      - name: Start IntSense Remote build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run flutter-nightly.yml --ref main
