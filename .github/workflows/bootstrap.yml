name: Bootstrap source

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: bootstrap
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Assemble IntSense Remote source
        run: |
          bash branding/bootstrap.sh
          git config user.name "IntSense"
          git config user.email "noreply@intsense.ai"
          # -f: в исходном .gitignore есть *png и *svg, а иконки нужны в репозитории
          git add -A -f .
          if git diff --cached --quiet; then echo "без изменений"; else git commit -qm "IntSense Remote source"; git push; fi
      - name: Restart IntSense Remote build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh run list --workflow flutter-nightly.yml --json databaseId,status -q '.[] | select(.status != "completed") | .databaseId'); do gh run cancel "$id" || true; done
          gh workflow run flutter-nightly.yml --ref main
