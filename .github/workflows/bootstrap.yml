name: Bootstrap source

on:
  workflow_dispatch:
  push:
    paths:
      - "intsense-remote-source.part-*"

permissions:
  contents: write
  actions: write

concurrency:
  group: bootstrap
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack IntSense Remote source
        id: unpack
        run: |
          n=$(ls intsense-remote-source.part-* 2>/dev/null | wc -l)
          if [ "$n" -lt 3 ]; then echo "частей: $n из 3, ждём остальные"; echo "ready=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          cat intsense-remote-source.part-0 intsense-remote-source.part-1 intsense-remote-source.part-2 > /tmp/src.tgz
          mkdir -p /tmp/src && tar xzf /tmp/src.tgz -C /tmp/src
          rsync -a /tmp/src/intsense-remote/ ./
          git rm -q intsense-remote-source.part-*
          git config user.name "IntSense"
          git config user.email "noreply@intsense.ai"
          git add -A
          git commit -qm "IntSense Remote source (unpacked)"
          git push
          echo "ready=yes" >> "$GITHUB_OUTPUT"
      - name: Start IntSense Remote build
        if: steps.unpack.outputs.ready == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run flutter-nightly.yml --ref main
